# TODO: Confirm 16KB ELF ABI and foreground-service runtime on physical Android 10–17 devices.
# Risks: upstream Go/NDK/AGP updates are resolved at build time and may fail closed;
#       do not publish to GitHub Releases until packet-capture and service tests pass.
name: Build experimental DNSCrypt APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dnscrypt-main-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Install Minisign
        run: sudo apt-get update && sudo apt-get install -y minisign binutils
      - name: Fetch and verify Quad9 signed source
        shell: bash
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/Quad9DNS/dnscrypt-settings/main/dnscrypt/quad9-resolvers.md
          mkdir -p app/src/main/assets
          curl --proto '=https' --tlsv1.2 -fsSL "$base" -o app/src/main/assets/quad9-resolvers.md
          curl --proto '=https' --tlsv1.2 -fsSL "$base.minisig" -o app/src/main/assets/quad9-resolvers.md.minisig
          minisign -Vm app/src/main/assets/quad9-resolvers.md -x app/src/main/assets/quad9-resolvers.md.minisig \
            -P 'RWTp2E4t64BrL651lEiDLNon+DqzPG4jhZ97pfdNkcq1VDdocLKvl5FW'
          for name in dnscrypt-ip4-nofilter-ecs-pri dnscrypt-ip4-nofilter-ecs-alt dnscrypt-ip6-nofilter-ecs-pri dnscrypt-ip6-nofilter-ecs-alt; do
            grep -Eq "^## ${name}[[:space:]]*$" app/src/main/assets/quad9-resolvers.md
          done
      - name: Validate OpenDNS TLS endpoint (no plaintext DNS)
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --connect-timeout 12 --max-time 25 \
            --resolve 'doh.opendns.com:443:146.112.41.2' \
            -fsS -o /dev/null 'https://doh.opendns.com/dns-query' || \
            { echo 'OpenDNS endpoint unavailable or invalid; fail closed' >&2; exit 1; }
      - name: Fetch pinned upstream and apply strict resolver patch
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --branch 2.1.18 --depth 1 https://github.com/DNSCrypt/dnscrypt-proxy.git upstream
          test "$(git -C upstream rev-parse HEAD)" = '458d2af16a8ece668d9453a3293004bdd08158e7'
          python3 scripts/strict_patch.py upstream/dnscrypt-proxy/xtransport.go
          gofmt -w upstream/dnscrypt-proxy/xtransport.go
          ! grep -A 30 'func (xTransport \*XTransport) resolve(host string' upstream/dnscrypt-proxy/xtransport.go | grep -E 'resolveUsingSystem|bootstrapResolvers'
      - name: Install latest stable NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list --channel=0 > ndk-list.txt
          NDK_VERSION="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("ndk-list.txt").read_text()
          found = set(re.findall(r'ndk;([0-9]+(?:\.[0-9]+)+)', text))
          if not found:
              raise SystemExit("No stable NDK in SDK manager")
          print(max(found, key=lambda x: tuple(map(int, x.split('.')))))
          PY
          )"
          yes | sdkmanager --install "ndk;$NDK_VERSION"
          echo "NDK_VERSION=$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Compile strict ARM64 Go ELF
        shell: bash
        run: |
          set -euo pipefail
          ndk_bin="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          (
            cd upstream
            CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
              CC="$ndk_bin/aarch64-linux-android29-clang" \
              CGO_LDFLAGS="-Wl,-z,max-page-size=16384" \
              go build -mod=vendor -trimpath -ldflags='-s -w -linkmode external -extldflags=-Wl,-z,max-page-size=16384' \
                -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libdnscryptproxy.so" ./dnscrypt-proxy
          )
          file app/src/main/jniLibs/arm64-v8a/libdnscryptproxy.so
          readelf -hW app/src/main/jniLibs/arm64-v8a/libdnscryptproxy.so
          readelf -lW app/src/main/jniLibs/arm64-v8a/libdnscryptproxy.so
          python3 - <<'PY'
          import re, subprocess
          path="app/src/main/jniLibs/arm64-v8a/libdnscryptproxy.so"
          out=subprocess.check_output(["readelf","-lW",path],text=True)
          aligns=[int(line.split()[-1],16) for line in out.splitlines() if re.match(r'\s*LOAD\s', line)]
          assert aligns and all(n>=16384 for n in aligns), f"ELF LOAD alignment insufficient: {aligns}"
          print("16KB ELF LOAD alignment confirmed:", aligns)
          PY
      - name: Update AGP to latest stable release for this build
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync_agp.py
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate ELF unchanged in APK
        shell: bash
        run: |
          set -euo pipefail
          sha256sum app/src/main/jniLibs/arm64-v8a/libdnscryptproxy.so > elf.sha256
          unzip -p app/build/outputs/apk/debug/app-debug.apk lib/arm64-v8a/libdnscryptproxy.so | sha256sum | cut -d' ' -f1 > embedded-elf.sha256
          test "$(cut -d' ' -f1 elf.sha256)" = "$(cat embedded-elf.sha256)"
      - name: Record actual versions and checksums
        if: always()
        shell: bash
        run: |
          mkdir -p build/reports
          { echo "commit=$GITHUB_SHA"; go version; gradle --version | head -20; echo "ndk=${NDK_VERSION:-not-installed}"; grep 'com.android.application' build.gradle.kts || true; } > build/reports/toolchain.txt
          find app/build/outputs/apk -name '*.apk' -type f -exec sha256sum {} \; > build/reports/apk-sha256.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dnscrypt-experimental-arm64
          path: |
            app/build/outputs/apk/debug/*.apk
            build/reports/
            elf.sha256
            embedded-elf.sha256
          if-no-files-found: warn
          retention-days: 30
